name: zoo
env:
  id: CartPole-v1
  n_envs: 1
algo:
  name: dqn
  impl: scratch
  device: cpu
  policy_kwargs:
    net_arch: [256, 256]
  hyperparams:  # RL Baselines3 Zoo values
    learning_rate: 0.0023
    batch_size: 64
    buffer_size: 100000
    learning_starts: 1000
    gamma: 0.99
    target_update_interval: 10
    train_freq: 256
    gradient_steps: 128
    exploration_fraction: 0.16
    exploration_final_eps: 0.04
train:
  total_timesteps: 50000
  seed: 0
  eval_freq: 5000
  n_eval_episodes: 10

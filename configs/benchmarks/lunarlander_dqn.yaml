name: zoo
env:
  id: LunarLander-v3
  n_envs: 1
algo:
  name: dqn
  device: cpu
  policy_kwargs:
    net_arch: [256, 256]
  hyperparams:  # RL Baselines3 Zoo values
    learning_rate: 0.00063
    batch_size: 128
    buffer_size: 50000
    learning_starts: 0
    gamma: 0.99
    target_update_interval: 250
    train_freq: 4
    gradient_steps: -1
    exploration_fraction: 0.12
    exploration_final_eps: 0.1
train:
  total_timesteps: 100000
  seed: 0
  eval_freq: 10000
  n_eval_episodes: 10

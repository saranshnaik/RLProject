study: ppo_warehouse
# Tune MaskablePPO + grid CNN on a cheaper problem than the headline (10x10, 2 items, no
# curriculum, 1M steps). The objective is final-policy efficiency on fresh *train-distribution*
# layouts, so the held-out test layouts are never used for selection.
#   uv run rlagent tune configs/sweeps/ppo_warehouse.yaml --workers 4
base: configs/warehouse/maskable_grid.yaml
n_trials: 24
eval_episodes: 50
seed: 0
prune: {n_startup_trials: 6, n_warmup_steps: 300000}
overrides:
  env.kwargs.height: 10
  env.kwargs.width: 10
  env.kwargs.n_items: 2
  curriculum: null
  train.total_timesteps: 1000000
  train.eval_freq: 50000
  train.n_eval_episodes: 20
space:
  algo.hyperparams.learning_rate: {type: float, low: 1.0e-4, high: 1.0e-3, log: true, template: "lin_{}"}
  algo.hyperparams.ent_coef: {type: float, low: 1.0e-3, high: 2.0e-2, log: true}
  algo.hyperparams.gamma: {type: categorical, choices: [0.99, 0.995, 0.998]}
  algo.hyperparams.gae_lambda: {type: categorical, choices: [0.9, 0.95, 0.98]}
  algo.hyperparams.n_steps: {type: categorical, choices: [64, 128, 256]}
  algo.hyperparams.batch_size: {type: categorical, choices: [128, 256, 512]}
  algo.hyperparams.n_epochs: {type: int, low: 3, high: 10}
  algo.hyperparams.clip_range: {type: categorical, choices: [0.1, 0.2, 0.3]}
tie:  # PBRS is only policy-invariant when the shaping discount equals the agent's gamma
  env.kwargs.shaping_gamma: algo.hyperparams.gamma
